<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABC Preview</title>
    <style>
      @import url(https://fonts.googleapis.com/css?family=Itim);

      @font-face {
        font-family: "itim-music";
        src:
          url("https://paulrosen.github.io/abcjs/fonts/itim-music.ttf") format("truetype"),
          url("https://paulrosen.github.io/abcjs/fonts/itim-music.woff") format("woff"),
          url("https://paulrosen.github.io/abcjs/fonts/itim-music.svg#icomoon") format("svg");
        font-weight: normal;
        font-style: normal;
      }

      h1 {
        margin: 0;
        padding: 0;
        flex-grow: 2;
      }

      .top {
        display: flex;
        align-items: flex-top;
        column-gap: 10px;
        justify-content: space-between;
      }

      .options {
        display: flex;
        flex-direction: column;
        margin-bottom: 0.5em;
        flex-shrink: 2;
        row-gap: 5px;
        border: 1px dotted #888;
      }

      .options > * {
        display: block;
      }

      .width-label {
        width: 80px;
        display: inline-block;
      }

      #source {
        display: none;
      }

      #source.show {
        display: block;
        border: 1px dotted #888;
        padding: 10px;
        margin-top: 10px;
      }

      body.light-mode {
        background-color: white;
        color: black;
      }
    </style>
  </head>

  <body>
    <div class="top">
      <label id="tune-selector">
        <span class="width-label">Tune:</span
        ><select></select>
      </label>
    </div>

    <div id="source"></div>
    <div id="paper"></div>

    <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.0/dist/abcjs-basic-min.js"></script>
    <script>
      let vscode = null;
      if (window.acquireVsCodeApi) {
        vscode = acquireVsCodeApi();
      }

      var options = {
        startingTune: 0,
        clickListener: clickListener,
        responsive: "resize",
        format: {
          gchordfont: '"itim-music,Itim" 20',
        },
      };

      // Merge initial configuration from extension
      var initialConfig = { initialConfig };
      Object.assign(options, initialConfig);

      var abc = `{editorContent}`;

      // The tunes returned by the last render, and the editor's last selection
      // (character offsets), kept so that the highlight survives a re-render.
      var renderedTunes = [];
      var cursorRange = null;

      function optionChanged() {
        drawTune(abc);
      }

      /**
       * Run abcjs, render the score from ABC notation.
       */
      function drawTune(abcCode) {
        renderedTunes = ABCJS.renderAbc("paper", abcCode, options);
        highlightCursorRange();

        const showSource = options.showTransposedSource;
        const source = document.getElementById("source");

        const transposition = parseInt(options.visualTranspose, 10);

        if (showSource && transposition) {
          const tuneBook = new ABCJS.TuneBook(abcCode);

          const tune = tuneBook.tunes[options.startingTune];
          if (tune) {
            const visualObj = ABCJS.renderAbc("*", tune.pure);
            source.classList.add("show");
            const output = ABCJS.strTranspose(tune.pure, visualObj, transposition);
            source.innerText = output;
          }
        } else {
          source.classList.remove("show");
        }
      }

      function setTune() {
        options.startingTune = this.value;
        drawTune(abc);
      }

      // todo: rearrange this to not sit in the global namespace.
      var select = document.querySelector("#tune-selector select");
      select.addEventListener("change", setTune);

      /**
       * Read tunes from the abc content
       */
      function analyzeContent(abcCode) {
        var tuneBook = new ABCJS.TuneBook(abcCode);

        if (tuneBook.tunes.length >= 2) {
          select.innerHTML = "";
          var option = document.createElement("option");
          var optionContent = document.createTextNode("-- select tune --");
          option.appendChild(optionContent);
          option.setAttribute("value", -1);
          select.appendChild(option);
          for (var i = 0; i < tuneBook.tunes.length; i++) {
            option = document.createElement("option");
            optionContent = document.createTextNode(tuneBook.tunes[i].title);
            option.appendChild(optionContent);
            option.setAttribute("value", i);
            select.appendChild(option);
          }
          select.value = options.startingTune;
          document.getElementById("tune-selector").style.display = "block";
        } else {
          document.getElementById("tune-selector").style.display = "none";
          options.startingTune = 0;
        }
      }

      /**
       * Highlights the notes covered by the editor's selection, and scrolls the
       * first of them into view when it is off screen. abcjs matches a collapsed
       * cursor against the element that ends at the cursor, the way its own
       * editor does.
       */
      function highlightCursorRange() {
        var tune = renderedTunes[0];
        if (!cursorRange || !tune || !tune.engraver) return;
        tune.engraver.rangeHighlight(cursorRange.start, cursorRange.end);
        var first = tune.engraver.selected && tune.engraver.selected[0];
        var element = first && first.elemset && first.elemset[0];
        if (element && element.scrollIntoView) {
          element.scrollIntoView({ block: "nearest", inline: "nearest" });
        }
      }

      function clickListener(abcElem, tuneNumber, classes) {
        vscode.postMessage({
          name: "click",
          //abcElem: abcElem,
          startChar: abcElem.startChar,
          endChar: abcElem.endChar,
          tuneNumber: tuneNumber,
          classes: classes,
        });
      }

      window.addEventListener("message", (event) => {
        const message = event.data; // The JSON data our extension sent

        switch (message.command) {
          case "contentChange":
            if (abc !== message.content) {
              abc = message.content;
              // Clear the display when content is empty
              if (!abc || abc.trim() === "") {
                document.getElementById("paper").innerHTML = "";
                document.getElementById("source").classList.remove("show");
                document.getElementById("tune-selector").style.display = "none";
              } else {
                analyzeContent(abc);
                drawTune(abc);
              }
            }
            break;

          case "configurationChange":
            // Merge config with existing options to preserve clickListener, startingTune, format
            Object.assign(options, message.content);
            drawTune(abc);
            break;

          case "cursorMove":
            cursorRange = { start: message.start, end: message.end };
            highlightCursorRange();
            break;

          case "setTheme":
            if (message.theme === "light") {
              document.body.classList.add("light-mode");
            } else {
              document.body.classList.remove("light-mode");
            }
            break;

          case "requestSvg":
            // Send the current rendering to the Editor.
            const svg = document.querySelectorAll("#paper svg")[0];
            const svgString = svg.outerHTML;

            vscode.postMessage({
              name: "svgExport",
              content: svgString,
            });
            break;
        }
      });

      document.addEventListener("DOMContentLoaded", function (event) {
        var optionEls = document.querySelectorAll(".option");
        for (var i = 0; i < optionEls.length; i++) {
          document.addEventListener("change", optionChanged);
        }

        analyzeContent(abc);
        drawTune(abc);
      });
    </script>
  </body>
</html>
