name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22.x"]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm install
      # Build all packages except native (requires cmake and MuseSampler)
      - run: npm run build:ci
      - run: npm test

  publish-release:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
      - run: npm install
      # Build the monorepo (esbuild needs compiled output)
      - run: npm run build:ci

      # Pack abcls-parser (standalone parser package, already built by build:ci above)
      - name: Pack abcls-parser
        run: cd parse && npm pack

      # Pack abcls (CLI + LSP server)
      - name: Build abcls package
        run: bash abc-cli/publish.sh
      - name: Pack abcls
        run: cd abc-cli/dist && npm pack

      # Pack abcls-kak (Kakoune plugin)
      - name: Build abcls-kak package
        run: bash abc-kak/publish.sh
      - name: Pack abcls-kak
        run: cd abc-kak/publish-dist && npm pack

      # Collect tarballs, plus a fixed-name copy of each so
      # .../releases/latest/download/<name>-latest.tgz always resolves to the newest release.
      - name: Collect release assets
        run: |
          mkdir -p release-assets
          cp parse/abcls-parser-*.tgz release-assets/
          cp parse/abcls-parser-*.tgz release-assets/abcls-parser-latest.tgz
          cp abc-cli/dist/abcls-*.tgz release-assets/
          cp abc-cli/dist/abcls-*.tgz release-assets/abcls-latest.tgz
          cp abc-kak/publish-dist/abcls-kak-*.tgz release-assets/
          cp abc-kak/publish-dist/abcls-kak-*.tgz release-assets/abcls-kak-latest.tgz

      - name: Create GitHub Release with tarball assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.tgz
          generate_release_notes: true

  publish-vscode:
    needs: build-and-test
    runs-on: ubuntu-latest
    # The environment name and this file's name must match the Trusted Publishing policy of the Marketplace publisher.
    environment: vsce-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
      - run: npm install
      - run: npm run build:ci
      # Because Azure DevOps retires its personal access tokens on 2026-12-01, the publish authenticates through the
      # GitHub OIDC token (Marketplace Trusted Publishing). The --oidc flag exists from vsce 4, so the version is pinned here.
      - name: Package and publish VS Code extension
        run: |
          npm run package:vscode
          npx @vscode/vsce@4.1.0 publish --packagePath abc-ls-*.vsix --oidc

  deploy-docs:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
      - run: npm install
      - run: npm run build:docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
