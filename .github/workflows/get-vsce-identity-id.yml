name: get-vsce-identity-id

# One-off diagnostic: prints the Azure DevOps/VSTS identity ID for the
# abcls-vsce-publish managed identity, which is what the marketplace
# publisher "Add member" screen actually expects (not the ARM resource ID,
# not the Azure AD principal ID). Delete this workflow once no longer needed.

on:
  workflow_dispatch:

jobs:
  print-identity-id:
    runs-on: ubuntu-latest
    environment: vsce-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Fetch VSTS identity profile
        run: |
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798
